name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Vérifications (avant de construire quoi que ce soit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install GTK4/libadwaita build headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libgirepository-2.0-dev gir1.2-gtk-4.0 gir1.2-adw-1 pkg-config

      - name: Install project (dev extra)
        run: pip install -e ".[dev]"

      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q

      # Sans ce garde-fou, taguer v0.2.0 publiait une release dont la roue
      # déclarait toujours `version = "0.1.0"` : impossible ensuite de savoir
      # ce que fait tourner un utilisateur. On échoue avant de publier quoi que
      # ce soit plutôt que de laisser passer une release mal étiquetée.
      - name: Le tag correspond à la version du paquet
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PKG_VERSION="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$TAG" != "v$PKG_VERSION" ]; then
            echo "::error::Tag $TAG ≠ version du paquet $PKG_VERSION." \
                 "Mets à jour pyproject.toml (version = \"${TAG#v}\") puis retague."
            exit 1
          fi
          echo "Tag $TAG cohérent avec la version $PKG_VERSION."

  publish:
    name: Publier la GitHub Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet requis par --generate-notes

      - name: Créer la GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
