name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: lint + type + test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 : ce que livrent Fedora 44 et Arch aujourd'hui — donc ce que fait
        # tourner une grande partie des utilisateurs, et la machine de dev. Son
        # absence signifiait que « CI verte » et « ça marche chez moi » ne
        # parlaient pas de la même chose.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # PyGObject-stubs (extra `dev`) déclare une dépendance dure sur PyGObject
      # lui-même (pas de roue manylinux, voir pyproject.toml) : sans ces
      # en-têtes système, `pip install .[dev]` échoue à la compilation.
      - name: Install GTK4/libadwaita build headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libgirepository-2.0-dev gir1.2-gtk-4.0 gir1.2-adw-1 pkg-config

      - name: Install project (dev extra)
        run: pip install -e ".[dev]"

      - name: ruff (lint)
        run: ruff check .

      - name: ruff (format)
        run: ruff format --check .

      - name: mypy
        run: mypy src

      - name: pytest
        run: pytest -q

  # La GUI est le point d'entrée réel du projet (`install.sh` finit par la
  # lancer, l'entrée de menu aussi), mais ses ~1360 lignes de widgets n'étaient
  # jamais importées en CI : le job `test` n'installe PyGObject que pour les
  # stubs mypy, et `install-script` tourne délibérément sans GTK. Ici on
  # construit chaque écran pour de vrai, sous serveur X virtuel.
  gui:
    name: GUI (construction des écrans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stack GTK4 + serveur X virtuel
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libcairo2-dev libgirepository-2.0-dev pkg-config \
            gir1.2-gtk-4.0 gir1.2-adw-1 python3-gi python3-gi-cairo

      # `--system-site-packages` : PyGObject vient du paquet distro (aucune roue
      # manylinux n'existe), exactement comme sur la machine d'un utilisateur.
      - name: Installer le projet dans un venv qui voit PyGObject
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --quiet -e ".[dev]"

      - name: Fumée GTK
        run: xvfb-run -a .venv/bin/python -m pytest tests/test_gui_smoke.py -v

  # `install.sh` est le point d'entrée de 100 % des utilisateurs (`curl | bash`)
  # et n'était exécuté nulle part : il n'avait jamais tourné ailleurs que sur la
  # Fedora du mainteneur, alors que le README promet « any Linux distribution ».
  # Ces conteneurs le lancent réellement sur les quatre familles supportées.
  #
  # GTK n'est volontairement pas installé : sans lui le script doit s'arrêter
  # proprement (code 0) en affichant la commande d'installation **de la bonne
  # distribution** — c'est le chemin que voit un nouvel utilisateur, et il teste
  # au passage `gtk_install_hint()` et la détection de famille.
  install-script:
    name: install.sh (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 12
            image: debian:12
            setup: apt-get update -qq && apt-get install -y -qq python3 python3-venv python3-pip git ca-certificates
            expected_hint: "apt install gir1.2-gtk-4.0"
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            setup: apt-get update -qq && apt-get install -y -qq python3 python3-venv python3-pip git ca-certificates
            expected_hint: "apt install gir1.2-gtk-4.0"
          - name: Fedora
            image: fedora:latest
            setup: dnf install -y -q python3 git ca-certificates
            expected_hint: "dnf install gtk4"
          - name: Arch
            image: archlinux:latest
            setup: pacman -Syu --noconfirm --needed python git ca-certificates
            expected_hint: "pacman -S gtk4"
    steps:
      - name: Dépendances système minimales
        run: ${{ matrix.setup }}

      - uses: actions/checkout@v4

      - name: Lancer install.sh --no-launch
        run: bash install.sh --no-launch 2>&1 | tee /tmp/install-output.txt

      - name: Le remède GTK proposé correspond à la distribution
        env:
          EXPECTED_HINT: ${{ matrix.expected_hint }}
        run: grep -F -- "$EXPECTED_HINT" /tmp/install-output.txt

      - name: Le venv, les raccourcis et l'entrée bureau sont en place
        run: |
          set -eux
          BASE="${XDG_DATA_HOME:-$HOME/.local/share}/stalker-gamma-linux"
          test -x "$BASE/venv/bin/stalker-gamma-linux"
          test -x "$BASE/venv/bin/stalker-gamma-linux-gui"
          test -L "$HOME/.local/bin/stalker-gamma-linux"
          test -f "${XDG_DATA_HOME:-$HOME/.local/share}/applications/stalker-gamma-linux-gui.desktop"

      - name: La CLI installée démarre
        run: |
          set -eux
          BASE="${XDG_DATA_HOME:-$HOME/.local/share}/stalker-gamma-linux"
          "$BASE/venv/bin/stalker-gamma-linux" --help > /dev/null
          # `doctor` sort en 1 dans un conteneur (ni 7z ni libunrar) : c'est le
          # comportement attendu, on vérifie seulement qu'il produit un rapport.
          "$BASE/venv/bin/stalker-gamma-linux" doctor | grep -q "Distribution:" || true

      - name: Relancer est idempotent
        run: bash install.sh --no-launch > /dev/null

  build:
    name: build package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14

  # Les règles du projet interdisent tout secret en dur, mais rien ne le
  # vérifiait : la revue humaine est le pire outil pour ça. gitleaks scanne
  # **l'historique complet** (d'où `fetch-depth: 0`) et pas seulement l'arbre
  # de travail — une clé commitée puis retirée reste exploitable tant qu'elle
  # est dans les objets git, et c'est justement le cas qu'on ne voit pas.
  #
  # Binaire épinglé plutôt que l'action officielle : celle-ci exige une clé de
  # licence dès qu'un dépôt appartient à une organisation, ce qui casserait la
  # CI le jour où le dépôt déménage.
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version

      - name: Scan git history
        run: ./gitleaks git --no-banner --redact --verbose .

  # `constraints.txt` fige la clôture transitive — mais figer n'est pas auditer.
  # Une version épinglée vieillit sur place : le jour où un avis de sécurité est
  # publié contre elle, RIEN ne change dans le dépôt, donc rien ne le signale.
  # C'est le prix exact de la reproductibilité, et ce job est ce qui le paie.
  # `pip-audit` interroge la base d'avis PyPI/OSV sur l'environnement RÉELLEMENT
  # installé — les transitives de `gamma-launcher` comprises, que personne ne
  # surveille de ce côté-ci puisqu'il ne les borne même pas.
  #
  # Python 3.11 parce que sa clôture est la plus LARGE : py7zr n'y tire
  # `backports.zstd` que sous 3.14, où la stdlib fournit `compression.zstd`.
  # Auditer le plus vieux Python supporté audite donc un sur-ensemble de ce que
  # voient les trois autres.
  deps:
    name: Dépendances (pip-audit)
    runs-on: ubuntu-latest
    # Non bloquant, pour l'instant. Un avis peut tomber un mardi matin sur une
    # transitive que personne ici ne peut corriger : bloquant, ce job arrêterait
    # toutes les PR en cours pour un problème sans rapport avec elles, et le
    # premier réflexe serait de le contourner — un job rouge qu'on apprend à
    # ignorer ne protège plus rien.
    # À rendre bloquant (supprimer cette ligne) quand les deux conditions sont
    # réunies : (1) plusieurs semaines de vert d'affilée, donc un bruit de fond
    # nul, et (2) une porte de sortie écrite pour les alertes non corrigeables
    # en amont — `--ignore-vuln GHSA-…`, chacune commentée avec sa raison et une
    # date de revue. Sans (2), la seule issue face au premier blocage serait de
    # remettre cette ligne, et on aurait juste perdu le temps du détour.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Même commande d'installation que `install.sh` (`-c constraints.txt`) :
      # auditer un `pip install .` sans contraintes auditerait un environnement
      # que personne n'installe jamais. Venv nu ici, en revanche : un runner
      # `setup-python` n'a de toute façon aucun paquet distro à voir, et un venv
      # nu garantit que la clôture auditée est complète.
      - name: Installer la clôture épinglée
        run: |
          python -m venv .venv
          # `setuptools` mis à jour en même temps que pip : ce n'est PAS une de
          # nos dépendances, c'est ce qu'`ensurepip` dépose dans tout venv 3.11
          # — et il y a des années de retard (65.5.0, cinq avis de sécurité
          # ouverts). Sans ça, le job passe rouge en permanence sur un paquet
          # qu'on n'installe pas, ne livre pas et ne peut pas épingler : le
          # rapport ne parlerait plus jamais de nos dépendances.
          .venv/bin/pip install --quiet --upgrade pip setuptools
          .venv/bin/pip install --quiet -c constraints.txt .

      # pip-audit dans SON venv, pointé sur l'autre via `--path` : installé dans
      # le même, il auditerait ses propres dépendances (il en tire une douzaine)
      # et le rapport ne parlerait plus de ce qu'on livre.
      # Pas de `--strict` : il ferait échouer la collecte sur `gamma-launcher` et
      # `stalker-gamma-linux`, absents de PyPI par construction. Ils ressortent
      # « skipped », ce qui est l'information juste — et `gamma-launcher` est
      # déjà épinglé au commit, donc immuable.
      - name: pip-audit sur l'environnement installé
        run: |
          python -m venv .audit
          .audit/bin/pip install --quiet pip-audit
          .audit/bin/pip-audit \
            --path "$(.venv/bin/python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')" \
            --desc=on --progress-spinner=off

  # Les noms de paquets pourrissent en silence. Constaté le 2026-08-16 :
  # `p7zip` avait disparu de Fedora et d'Arch (remplacé par `7zip`) et
  # `libunrar5t64` n'existe pas sur Debian 13 — le seul remède qu'on affiche à
  # l'utilisateur échouait donc sur trois des quatre distributions promises,
  # sans que rien ne le signale : `install.sh` n'installe pas ces paquets, et
  # aucun test ne pouvait interroger des dépôts distants.
  #
  # Ce job demande à chaque distribution si les noms qu'on affiche existent
  # réellement chez elle. Il n'installe rien.
  package-names:
    name: Noms de paquets (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 12
            image: debian:12
            family: debian
            # contrib/non-free activés : `libunrar5` et `steam` n'y sont pas
            # sans eux, et le remède qu'on affiche le dit déjà à l'utilisateur.
            # Ubuntu, lui, active universe/multiverse par défaut.
            setup: >-
              sed -i 's/^Components: main$/Components: main contrib non-free/'
              /etc/apt/sources.list.d/debian.sources &&
              apt-get update -qq && apt-get install -y -qq python3
            query: apt-cache show
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            family: debian
            setup: apt-get update -qq && apt-get install -y -qq python3
            query: apt-cache show
          - name: Fedora
            image: fedora:latest
            family: fedora
            # RPM Fusion nonfree activé comme le fait le remède qu'on affiche :
            # `libunrar` et `steam` n'existent que là, et vérifier sans lui
            # reviendrait à tester un chemin que personne ne suit.
            setup: >-
              dnf install -y -q python3
              "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm -E %fedora).noarch.rpm"
            query: dnf list --available
          - name: Arch
            image: archlinux:latest
            family: arch
            # multilib activé : `umu-launcher`, `steam` et `lib32-gamemode` n'y
            # sont pas sans lui. C'est la configuration de toute machine Arch
            # qui joue, mais pas celle de l'image nue — sans ça on testerait un
            # Arch que personne n'utilise pour jouer.
            setup: >-
              printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf &&
              pacman -Syu --noconfirm --needed python
            query: pacman -Si
    steps:
      - uses: actions/checkout@v4

      - name: Prérequis de l'image
        run: ${{ matrix.setup }}

      - name: Les paquets annoncés existent-ils ?
        env:
          FAMILY: ${{ matrix.family }}
          QUERY: ${{ matrix.query }}
          DISTRO: ${{ matrix.name }}
        run: |
          # Noms extraits de la source de vérité, sans dupliquer la liste ici.
          PACKAGES="$(PYTHONPATH=src python3 -c "
          import os
          from stalker_gamma_linux.environment.commands import INSTALL_COMMANDS
          from stalker_gamma_linux.environment.distro import DistroFamily
          family = DistroFamily(os.environ['FAMILY'])
          names = {n for c in INSTALL_COMMANDS.values() for n in c.packages.get(family, ())}
          print(' '.join(sorted(names)))
          ")"
          echo "À vérifier : $PACKAGES"
          if [ -z "$PACKAGES" ]; then
            echo "::error::Aucun nom de paquet extrait — vérification impossible."
            exit 1
          fi
          missing=""
          for package in $PACKAGES; do
            if $QUERY "$package" >/dev/null 2>&1; then
              echo "  ok       $package"
            else
              echo "  ABSENT   $package"
              missing="$missing $package"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Paquets introuvables dans les dépôts de $DISTRO :$missing"
            exit 1
          fi
