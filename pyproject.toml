[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stalker-gamma-linux"
version = "0.6.0"
description = "Linux integration layer for installing S.T.A.L.K.E.R. G.A.M.M.A."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    # Épinglé au COMMIT, pas au tag. Un tag git est mutable : l'amont — ou
    # quiconque obtient ses accès — peut le déplacer sans que cette ligne change,
    # et chaque réinstallation récupérerait alors un code différent, silencieusement
    # (CWE-494). Le SHA, lui, EST le contenu. Correspondance lisible : le tag v3.1
    # désigne aujourd'hui ade656e0. À revérifier avant toute montée de version :
    # `git ls-remote --tags https://github.com/Mord3rca/gamma-launcher.git`.
    "gamma-launcher @ git+https://github.com/Mord3rca/gamma-launcher.git@ade656e029a8547d8853ce1ba54f9b7f0acb9100",
    # Bornes hautes : sans elles `rich>=13.0` résolvait déjà en 15.x, deux majeures
    # au-dessus de la seule version jamais testée ici — une rupture d'API amont
    # arrivait donc chez l'utilisateur sans passer par la CI. Ces bornes disent
    # « une majeure connue » ; `constraints.txt` dit « celle-ci, exactement ».
    "rich>=13.0,<16",
    "tomli-w>=1.0,<2",
]

[project.urls]
Homepage = "https://github.com/Grokitach/Stalker_GAMMA"

[project.scripts]
stalker-gamma-linux = "stalker_gamma_linux.cli:main"
stalker-gamma-linux-gui = "stalker_gamma_linux.gui.launch:main"

[project.optional-dependencies]
# PyGObject n'a pas de roue manylinux (extension liée à GLib/GObject-introspection
# du système) : elle doit venir du paquet système de la distribution (voir
# `environment.checks.check_gtk_gui` pour les commandes par distribution), ou d'un
# venv créé avec `--system-site-packages`. La CLI ne dépend jamais de ce groupe.
gui = ["PyGObject>=3.50"]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "PyGObject-stubs>=2.10",
    "Babel>=2.14",  # extraction/compilation .pot/.po/.mo (i18n) — jamais requis à l'exécution
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stalker_gamma_linux = [
    "assets/icon.png",
    "assets/logo.png",
    "assets/background.jpg",
    # Variante floutée/assombrie, affichée derrière les pages de contenu
    # (progression, diagnostic) — cf. `gui/windows/background.py`.
    "assets/background-blur.jpg",
    # La feuille de style n'est plus une chaîne Python : sans cette ligne, une
    # installation par `pip` livrerait une GUI sans aucun style.
    "gui/theme/style.css",
    "locale/*/LC_MESSAGES/*.mo",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.isort]
# `tests` héberge des outils partagés (`conftest.RecordingReporter`) : sans
# ça, isort les rangeait avec les dépendances tierces.
# `artwork` : le paquet de génération d'artwork sous `scripts/`, qui n'est pas
# installé — sans cette ligne, isort le rangeait avec les dépendances tierces.
known-first-party = ["stalker_gamma_linux", "tests", "artwork"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# La racine du repo sur le `sys.path` de pytest : trois modules de tests
# importent des utilitaires partagés via `from tests.conftest import ...`.
# Sans ça, seul `python -m pytest` (qui ajoute le cwd) collecte — le `pytest`
# nu de la CI échoue à l'import, `tests` n'étant pas un paquet installé.
pythonpath = ["."]
addopts = "-ra -m \"not network\""
markers = [
    "network: exercises the real gamma-launcher binary and/or network access (excluded by default)",
]
